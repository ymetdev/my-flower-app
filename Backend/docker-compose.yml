services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

  backend:
    build: .
    env_file:
      - .env
    container_name: flower-backend
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      # แก้บรรทัดด้านล่างนี้ให้เหลือแค่ชื่อ service (mongodb)
      - MONGO_URI=mongodb://mongodb:27017/flower_shop
      - PORT=5000
    volumes:
      - ./uploads:/app/uploads # ป้องกันรูปสลิปหายเมื่อรีสตาร์ท container

volumes:
  mongo-data:
